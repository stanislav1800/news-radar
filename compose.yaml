# Сито целиком: база, миграции, веб и worker.
#   docker compose up -d          — всё
#   docker compose up -d db       — только база (для разработки, веб и worker запускаются из исходников)
# Настройки — в .env (пример: .env.example), обязателен SITO_SECRET_KEY.

# Логи контейнеров: не больше 5 файлов по 20 МБ на сервис, иначе за месяцы займут весь диск
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-app: &app
  build: .
  logging: *logging
  image: sito:latest
  restart: unless-stopped
  env_file: .env
  environment:
    # Внутри compose база доступна по имени сервиса; DATABASE_URL из .env (для разработки) здесь не нужен
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-pass}@db:5432/sito
    # Метрики для Prometheus: порт виден только внутри docker-сети (не в ports)
    METRICS_PORT: 9100
    # Логи — JSON: их разбирает Loki (профиль monitoring). Читать без него: docker compose logs worker | jq
    LOG_FORMAT: json
  volumes:
    - models:/home/sito/.cache/huggingface  # модель эмбеддингов (около 1 ГБ) скачивается один раз
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg16
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: sito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sito"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Резервная копия базы раз в сутки: ./backups/sito-ГГГГММДД-ЧЧММ.dump, хранятся BACKUP_KEEP последних (7).
  # Восстановить — см. README, «Резервные копии». После удачной копии пишет отметку в heartbeat:
  # нет свежей дольше 26 часов — администратор увидит уведомление
  # Секреты подключений (сессия Telegram) в копии зашифрованы: без SITO_SECRET_KEY из .env их не открыть
  backup:
    image: pgvector/pgvector:pg16
    logging: *logging
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-pass}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/sito-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -h db -U postgres -Fc sito -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "backup: $$f ($$(du -h "$$f" | cut -f1))"
            psql -h db -U postgres -d sito -qc "INSERT INTO heartbeat (name, started_at, beat_at) VALUES ('backup', now(), now()) ON CONFLICT (name) DO UPDATE SET beat_at = now()" || true
            ls -1t /backups/sito-*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm --
          else
            rm -f "$$f.tmp"; echo "backup: ОШИБКА, следующая попытка через час"; sleep 3600; continue
          fi
          sleep 86400
        done

  # Применяет миграции и завершается; веб и worker стартуют после него
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    volumes: []
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: ["sito", "web"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-pass}@db:5432/sito
      METRICS_PORT: 9100
      LOG_FORMAT: json
      # Порт открыт только на этой машине (см. ports), поэтому доверять X-Forwarded-* можно любому
      # отправителю — это обратный прокси на хосте. Открываете порт наружу — укажите адрес прокси.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["python", "-m", "sito.worker"]
    stop_grace_period: 30s  # дать дописать текущую пачку

  # --- Мониторинг (необязательно): docker compose --profile monitoring up -d -------------------
  # Grafana — http://127.0.0.1:3000 (вход admin / GRAFANA_PASSWORD из .env), дашборд «Сито» уже настроен.
  # Метрики — Prometheus, логи — Loki (собирает Alloy), всё хранится 30 дней
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    logging: *logging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    logging: *logging
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sito.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.5.3
    profiles: [monitoring]
    logging: *logging
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki

  # Читает логи контейнеров через Docker API. Доступ к docker.sock — почти права root на машине:
  # только чтение и только внутри сети compose, наружу Alloy не открыт
  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [monitoring]
    logging: *logging
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      SITO_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  pgdata:
  models:
  prometheus:
  grafana:
  loki:
  alloy:
