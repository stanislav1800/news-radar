[project]
name = "sito"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "77958472+stanislav1800@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pymorphy3>=2.0.6",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "telethon>=1.40",
    "torch>=2.14.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
sito = "sito.cli:app"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
timezone = "UTC"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Один event loop на все тесты: engine и пул соединений живут весь прогон
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# torch без CUDA: на сервере нет видеокарты, а CUDA-сборка весит несколько гигабайт
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Библиотеки без аннотаций типов
module = ["feedparser", "feedparser.*", "asyncpg", "asyncpg.*", "pymorphy3", "pymorphy3.*", "telethon", "telethon.*"]
ignore_missing_imports = true
